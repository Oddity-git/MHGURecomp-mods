name: Fetch mod previews

on:
  workflow_dispatch:
    inputs:
      mods:
        description: "Mod folder names to fetch, space separated (empty = every mod without a preview)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_previews.py ${{ github.event.inputs.mods }}
      - name: Commit new previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Fetch mod previews from GameBanana" && git push)
